# 身份键（mod_id / mod_version / …）已上收仓库根 gradle.properties，
# 本文件只留平台自己的构建事实。读不到身份键时构建会直接失败（挂载脚本负责）。
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.configuration-cache=false

## Environment Properties

neoforge_version=21.1.252

# Compile-time / dev-runtime dependency: Female Gender Mod (via the Modrinth maven)
fgm_version=3.2.2

## Mod Properties

# 产物名带平台标识；版本号在仓库根（mod_version），jar 名 = <archives_base_name>-<mod_version>
archives_base_name=fgmplus-neoforge-1.21.1
