plugins {
	id 'fabric-loom' version "${loom_version}"
}

// 共享层装配：读仓库级身份 + 把 shared/ 与本目标挂载的层接进源集。
// 判定依据在 versions/*.json，本平台不做任何目标名硬编码。
apply from: '../../gradle/fgmplus-layers.gradle'

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Female Gender Mod itself is mapped with official Mojang names, so we use the same layering
	mappings loom.layered {
		officialMojangMappings()
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Upstream mod this expands on; provides both compile-time internals and the dev-runtime jar
	modImplementation "maven.modrinth:female-gender:${project.fgm_version}"
}

processResources {
	inputs.property 'version', project.mod_version
	inputs.property 'minecraft_dependency', project.minecraft_dependency

	filesMatching('fabric.mod.json') {
		expand 'version': project.mod_version,
				'minecraft_dependency': project.minecraft_dependency
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	// LICENSE lives at the repo root; fgmplusRepoRoot is injected by the mounting script
	from(project.ext.fgmplusRepoRoot) {
		include 'LICENSE'
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
